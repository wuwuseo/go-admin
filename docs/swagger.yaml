        in: formData
        name: group_id
        type: integer
      - description: 分片索引（0-based，启用分片上传时必填）
        in: formData
        name: chunk_index
        type: integer
      - description: 总片数（启用分片上传时必填）
        in: formData
        name: total_chunks
        type: integer
