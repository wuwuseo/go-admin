        in: formData
        name: upload_id
        type: string
      - description: 原始文件名（首片必填）
        in: formData
        name: filename
        type: string
      - description: 文件总大小（首片必填）
        in: formData
        name: file_size
        type: integer
      - description: 单片大小（首片必填）
        in: formData
        name: chunk_size
        type: integer
      - description: MIME类型
        in: formData
        name: mime_type
        type: string
